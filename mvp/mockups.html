html,body{height:100%;overflow:hidden}

.top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:20px 28px;z-index:3;pointer-events:none}
.top>*{pointer-events:auto}

.status{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:999px;background:var(--chip);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font:500 13px/1 var(--font);color:var(--fg2);box-shadow:var(--shadow);z-index:3;white-space:nowrap}

.status b{color:var(--fg);font-weight:600}
.status .sep{width:1px;height:12px;background:var(--line)}

.tip.on{opacity:1}
.tip small{display:block;font:400 11px/1.4 var(--mono);opacity:.65;margin-top:2px}

.picker button:hover{color:#fff;background:rgba(255,255,255,.06)}

    }
    links.forEach(({ a, b }) => {
      const len = a.kind === 'core' || b.kind === 'core' ? 140 : b.kind === 'zone' ? 70 : 120;
      let dx = b.x - a.x, dy = b.y - a.y; const d = Math.sqrt(dx * dx + dy * dy) || 1; const f = ((d - len) / d) * 0.06 * alpha;
      a.vx += dx * f; a.vy += dy * f; b.vx -= dx * f; b.vy -= dy * f;
    });
    nodes.forEach((n) => {
      n.vx += (cx - n.x) * 0.006 * alpha; n.vy += (cy - n.y) * 0.006 * alpha;
      if (n.fx != null) { n.x = n.fx; n.y = n.fy; n.vx = n.vy = 0; return; }
      n.vx *= 0.82; n.vy *= 0.82; n.x += n.vx; n.y += n.vy;
    });
    alpha *= 0.992;
  }
  // gentle idle drift, like Obsidian's graph breathing
  const t = performance.now() / 1000;
  links.forEach((l) => { l.el.setAttribute('x1', l.a.x); l.el.setAttribute('y1', l.a.y); l.el.setAttribute('x2', l.b.x); l.el.setAttribute('y2', l.b.y); });
  els.forEach(({ n, g }, i) => g.setAttribute('transform', `translate(${(n.x + Math.sin(t * .6 + i) * .8).toFixed(1)},${(n.y + Math.cos(t * .5 + i) * .8).toFixed(1)})`));
  requestAnimationFrame(tick);
}

function apply(i) {
  cur = (i + V.length) % V.length;
  const v = V[cur];
  const s = document.body.style;
  ['bg', 'bgfx', 'fg', 'fg2', 'accent', 'ok', 'warn', 'bad', 'dim', 'link', 'line', 'chip', 'hover', 'cta-bg', 'cta-fg', 'cta-shadow', 'cta-border', 'tip-bg', 'tip-fg', 'r', 'font', 'mono', 'logo-font', 'logo-ls', 'label-font', 'overlay', 'shadow', 'lw'].forEach((k) => s.removeProperty('--' + k));
  for (const k in v.vars) s.setProperty('--' + k, v.vars[k]);
  document.querySelectorAll('.picker button').forEach((b, j) => b.classList.toggle('on', j === cur));
  history.replaceState(null, '', '#' + (cur + 1));
  build(); alpha = Math.max(alpha, .25);
}
document.getElementById('picker').innerHTML = V.map((v, i) => `<button><b>${String(i + 1).padStart(2, '0')} ${v.name}</b><span>${v.sub}</span></button>`).join('');
document.querySelectorAll('.picker button').forEach((b, i) => (b.onclick = () => apply(i)));
addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') apply(cur + 1); if (e.key === 'ArrowLeft') apply(cur - 1); });
addEventListener('resize', () => { W = innerWidth; H = innerHeight; alpha = .5; });
apply((parseInt(location.hash.slice(1), 10) || 1) - 1);
tick();
</script>
</body>
</html>
